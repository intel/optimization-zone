<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">AWS 8i socket with SNC3 enabled: three compute dies presented as three NUMA nodes</title>
  <desc id="d">One 8i socket. Three compute dies are stacked vertically, each with 32 cores and 64 threads, and each presented to the operating system as its own NUMA node: compute die 0 is NUMA node 0, compute die 1 is NUMA node 1, compute die 2 is NUMA node 2. Two DDR memory channels attach to each side of every compute die, 4 per die and 12 per socket. One IO die sits above the compute die stack and a second below it, with a die-to-die crossing at each interface.</desc>
  <rect x="0" y="0" width="780" height="560" fill="#fcfcfb"/>
  <text x="40" y="28" font-size="17" font-weight="600" fill="#0b0b0b">8i socket &#8212; 96 cores / 192 threads</text>
  <text x="40" y="48" font-size="13" fill="#52514e">3 compute dies &#183; 2 IO dies &#183; 12 memory channels &#183; SNC3 enabled</text>
  <rect x="250" y="68" width="280" height="34" rx="8" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="390" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">IO Die</text>
  <rect x="250" y="494" width="280" height="34" rx="8" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="390" y="516" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">IO Die</text>
  <path d="M290 106 V118" stroke="#c3c2b7" stroke-width="2.5"/>
